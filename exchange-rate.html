/* 선긋기 연결선: 렌더 직후와 크기 변경 때 다시 그립니다. */
function frameQuizLines(host){

/* 마운트: host 안에 퀴즈를 그리고 클릭·입력·키보드를 처리합니다.
 * opt = {page(): {content:{questions},quizType}, state, complete(), cfg, onRender(view), onCheck(q,result)} */
function frameQuizMount(host,opt){
  var cfg=function(){return Object.assign({shuffle:false,retry:true,reveal:'immediate',result:false},opt.cfg||{});};
  var st=function(){return frameQuizState(opt.state);};
  function find(id){return frameQuizQuestions(opt.page()).filter(function(q){return q.id===id;})[0];}
  function render(focusKey,focusFeedback){
    var active=document.activeElement,key=focusKey||(active&&host.contains(active)?active.dataset.key:null);
    var v=frameQuizRender(opt.page(),opt.state,opt.complete?opt.complete():false,cfg());
    frameClear(host);host.appendChild(v.node);frameQuizLines(host);
    var target=focusFeedback?host.querySelector('.dc-content .qz-feedback'):null;
    if(!target&&key){try{target=host.querySelector('.dc-content '+frameSel('[data-key="'+key.replace(/"/g,'\\"')+'"]'));}catch(err){target=null;}}
    if(target)target.focus({preventScroll:false});
    if(opt.onRender)opt.onRender(v);
  }
  function setAnswer(q,val){var s=st();s.answers[q.id]=val;if(s.ui[q.id])delete s.ui[q.id].msg;}
  function confirm(q){
    var s=st(),ans=s.answers[q.id];
    if(q.type==='auto'){ans=opt.complete&&opt.complete()?'complete':'incomplete';s.answers[q.id]=ans;}
    var res=frameQuizJudge(q,ans,{complete:opt.complete&&opt.complete()});
    if(res.status==='empty'||res.status==='invalid'){s.ui[q.id]=Object.assign({},s.ui[q.id],{msg:res.status==='invalid'?res.detail:frameQuizEmptyMessage(q)});render();return;}
    s.checked[q.id]=true;if(s.ui[q.id])delete s.ui[q.id].msg;
    if(opt.onCheck)opt.onCheck(q,res);
    render(null,true);
  }
  function onClick(ev){
    var b=ev.target.closest('[data-qz]');if(!b||!host.contains(b)||b.disabled)return;
    var s=st(),act=b.dataset.qz;
    var qsAll=frameQuizQuestions(opt.page());
    if(act==='goto'){s.quizIndex=Number(b.dataset.index)||0;render();var qg=host.querySelector('.dc-content .qz-q');if(qg)qg.focus();return;}
    if(act==='redo-all'){qsAll.forEach(function(x){delete s.checked[x.id];delete s.answers[x.id];delete s.ui[x.id];});s.quizIndex=0;render();var qr=host.querySelector('.dc-content .qz-q');if(qr)qr.focus();return;}
    if(act==='redo-wrong'){var first=-1;qsAll.forEach(function(x,i){if(x.type!=='reveal'&&s.checked[x.id]&&frameQuizJudge(x,s.answers[x.id],{complete:opt.complete&&opt.complete()}).status!=='correct'){delete s.checked[x.id];if(x.type==='auto')delete s.answers[x.id];if(first<0)first=i;}});if(first>=0)s.quizIndex=first;render();var qw=host.querySelector('.dc-content .qz-q');if(qw)qw.focus();return;}
    if(act==='nav'){var total=qsAll.length+(cfg().result?1:0),d=b.dataset.dir==='next'?1:-1;s.quizIndex=Math.max(0,Math.min(total-1,(Number(s.quizIndex)||0)+d));render();var qq=host.querySelector('.dc-content .qz-q');if(qq)qq.focus();return;}
    var item=b.closest('[data-question-id]');if(!item)return;
    var q=find(item.dataset.questionId);if(!q)return;
    var key=b.dataset.key,cur;
    if(act==='confirm'){confirm(q);return;}
    if(act==='retry'){delete s.checked[q.id];if(q.type==='auto')delete s.answers[q.id];if(s.ui[q.id])delete s.ui[q.id].msg;render('confirm');return;}
    if(act==='select'){
      if(q.type==='multi'){cur=Array.isArray(s.answers[q.id])?s.answers[q.id].slice():[];var i=cur.indexOf(b.dataset.opt);if(i>=0)cur.splice(i,1);else cur.push(b.dataset.opt);setAnswer(q,cur);}
      else setAnswer(q,b.dataset.opt);
    }else if(act==='sort'){cur=Object.assign({},s.answers[q.id]);cur[b.dataset.id]=b.dataset.group;setAnswer(q,cur);}
    else if(act==='up'||act==='down'){
      cur=Array.isArray(s.answers[q.id])?s.answers[q.id].slice():frameQuizOrderStart(q);var p=cur.indexOf(b.dataset.id),np=act==='up'?p-1:p+1;
      if(p<0||np<0||np>=cur.length)return;var tmp=cur[p];cur[p]=cur[np];cur[np]=tmp;setAnswer(q,cur);
      if((act==='up'&&np===0)||(act==='down'&&np===cur.length-1))key=(act==='up'?'down:':'up:')+b.dataset.id;
    }else if(act==='m-left'){
      var u=s.ui[q.id]=Object.assign({},s.ui[q.id]);u.sel=u.sel===b.dataset.id?null:b.dataset.id;delete u.msg;
    }else if(act==='m-right'){
      var u2=s.ui[q.id]=Object.assign({},s.ui[q.id]);cur=Object.assign({},s.answers[q.id]);delete u2.msg;
      if(u2.sel!=null){Object.keys(cur).forEach(function(l){if(String(cur[l])===b.dataset.id)delete cur[l];});cur[u2.sel]=b.dataset.id;u2.sel=null;setAnswer(q,cur);}
      else{Object.keys(cur).forEach(function(l){if(String(cur[l])===b.dataset.id)delete cur[l];});setAnswer(q,cur);}
    }else return;
    render(key);
  }
  function onInput(ev){
    var t=ev.target.closest('[data-qz-input]');if(!t||!host.contains(t))return;
    var item=t.closest('[data-question-id]'),q=item&&find(item.dataset.questionId);if(!q)return;
    if(t.dataset.qzInput==='blank'){var cur=Array.isArray(st().answers[q.id])?st().answers[q.id].slice():[];cur[Number(t.dataset.idx)]=t.value;setAnswer(q,cur);}
    else setAnswer(q,t.value);
    var m=host.querySelector('.dc-content .qz-msg');if(m)m.remove();
  }
  function onKey(ev){if(ev.key==='Enter'&&ev.target.matches&&ev.target.matches('[data-qz-input]')){var item=ev.target.closest('[data-question-id]'),q=item&&find(item.dataset.questionId);if(q&&!st().checked[q.id]){ev.preventDefault();confirm(q);}}}
  var onResize=function(){frameQuizLines(host);};
  host.addEventListener('click',onClick);host.addEventListener('input',onInput);host.addEventListener('change',onInput);host.addEventListener('keydown',onKey);window.addEventListener('resize',onResize);
  var ro=typeof ResizeObserver==='function'?new ResizeObserver(onResize):null;if(ro)ro.observe(host);
  return {render:render,destroy:function(){host.removeEventListener('click',onClick);host.removeEventListener('input',onInput);host.removeEventListener('change',onInput);host.removeEventListener('keydown',onKey);window.removeEventListener('resize',onResize);if(ro)ro.disconnect();}};
}

/* set: {유형:문항수}. 순서는 유형 표시 순서를 따릅니다. 반환: questions 배열 */
function frameQuizFromSet(set,prefix){
  var samples=frameQuizSamples(),order=Object.keys(frameQuizTypes()),out=[],n=0;
  order.forEach(function(type){var count=Math.max(0,Math.min(5,Math.trunc(Number(set&&set[type])||0)));
    for(var i=0;i<count;i++){n++;var base=samples[type][0];out.push(Object.assign(JSON.parse(JSON.stringify(base)),{id:(prefix||'q')+'-'+n}));}});
  return out;
}
function frameQuizLegacySet(quizType){return {answer:{reveal:1},multiple:{choice:1},ox:{ox:1},auto:{auto:1}}[quizType]||{choice:1};}

    st.factorId = 'import';

  }

  function syncHintContent() {

    const quoteText = isInc ? f.incQuote : f.decQuote;

      {

      }
    ];

  function getExpected() {
    const f = getFactor();
    const s1 = f.curve;
    const s2 = st.factorChange === 'inc' ? 'increase' : 'decrease';
    const s3 = s2 === 'increase' ? 'right' : 'left';
    let s4 = 'up';
    if (s1 === 'demand') {
      s4 = s2 === 'increase' ? 'up' : 'down';
    } else {
      s4 = s2 === 'increase' ? 'down' : 'up';
    }
    return { s1, s2, s3, s4 };
  }

  function resetToIdle() {
    clearStepTimer();
    st.step = 0;
    st.modalOpen = false;
    st.bannerMsg = null;
    st.ans = { s1: null, s2: null, s3: null, s4: null };
    st.wrong = { s1: null, s2: null, s3: null, s4: null };
    st.feedback = null;
    st.running = false;
    anim.shiftProgress = 0;
    anim.shiftTarget = 0;
    anim.rateProgress = 0;
    anim.rateTarget = 0;
    anim.particles = [];
    syncPlayBtnUI();
  }

  function spawnCelebration() {
    anim.particles = [];
    for (let i = 0; i < 24; i++) {
      const angle = (Math.PI * 2 * i) / 24 + (Math.random() - 0.5) * 0.2;
      const speed = 45 + Math.random() * 80;
      anim.particles.push({
        dx: Math.cos(angle) * speed,
        dy: Math.sin(angle) * speed,
        life: 1,
        size: 4 + Math.random() * 4,
        color: i % 2 === 0 ? colors.success : colors.accent
      });
    }
  }

  function ensureLoop() {
    if (!active) return;
    if (!rafId) {
      lastTime = 0;
      rafId = requestAnimationFrame(tick);
    }
  }

  function stopLoop() {
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = 0;
    }
    lastTime = 0;
  }

  function needsAnimation() {
    if (st.step >= 2) return true;
    if (Math.abs(anim.shiftProgress - anim.shiftTarget) > 0.002) return true;
    if (Math.abs(anim.rateProgress - anim.rateTarget) > 0.002) return true;
    if (anim.particles.length > 0) return true;
    return false;
  }

  function tick(now) {
    rafId = 0;
    if (!active) return;
    const dt = lastTime ? Math.min((now - lastTime) / 1000, 0.08) : 0.016;
    lastTime = now;

    anim.highlightPulse = (anim.highlightPulse + dt * 3.5) % (Math.PI * 2);

    if (anim.shiftProgress < anim.shiftTarget) {
      anim.shiftProgress = Math.min(anim.shiftTarget, anim.shiftProgress + dt * 1.35);
    } else if (anim.shiftProgress > anim.shiftTarget) {
      anim.shiftProgress = Math.max(anim.shiftTarget, anim.shiftProgress - dt * 2.0);
    }

    if (anim.rateProgress < anim.rateTarget) {
      anim.rateProgress = Math.min(anim.rateTarget, anim.rateProgress + dt * 1.35);
    } else if (anim.rateProgress > anim.rateTarget) {
      anim.rateProgress = Math.max(anim.rateTarget, anim.rateProgress - dt * 2.0);
    }

    for (let i = anim.particles.length - 1; i >= 0; i--) {
      const p = anim.particles[i];
      p.life -= dt * 1.2;
      if (p.life <= 0) anim.particles.splice(i, 1);
    }

    draw();
    if (needsAnimation()) {
      rafId = requestAnimationFrame(tick);
    }
  }

  function handleChoice(stepNum, choiceVal) {
    if (st.step !== stepNum || !st.modalOpen) return;
    const exp = getExpected();
    const f = getFactor();
    const key = 's' + stepNum;
    const expectedVal = exp[key];

    if (choiceVal === expectedVal) {
      st.ans[key] = choiceVal;
      st.wrong[key] = null;
      st.feedback = null;

      if (stepNum === 1) {
        st.step = 2;
        st.modalOpen = false;
        st.bannerMsg = {

        };
        renderSimStageUI();
        draw();
        ensureLoop();
        clearStepTimer();
        stepTimer = setTimeout(() => {
          st.bannerMsg = null;
          st.modalOpen = true;
          renderSimStageUI();
        }, 1250);
      } else if (stepNum === 2) {
        st.step = 3;
        st.modalOpen = true;
        renderSimStageUI();
        draw();
        ensureLoop();
      } else if (stepNum === 3) {
        st.step = 4;
        st.modalOpen = false;
        anim.shiftProgress = 0;
        anim.shiftTarget = 1;
        const dirWord = choiceVal === 'right' ? '오른쪽' : '왼쪽';
        st.bannerMsg = {
          main: '정답입니다! ' + f.curveLabel + ' 곡선이 ' + dirWord + '으로 이동하는 모습을 확인하세요.',
          sub: '곡선 이동 후 마지막 질문이 나타납니다...'
        };
        renderSimStageUI();
        draw();
        ensureLoop();
        clearStepTimer();
        stepTimer = setTimeout(() => {
          st.bannerMsg = null;
          st.modalOpen = true;
          renderSimStageUI();
        }, 1450);
      } else if (stepNum === 4) {
        st.step = 5;
        st.modalOpen = false;
        st.running = false;
        anim.rateProgress = 0;
        anim.rateTarget = 1;
        st.completedCount = (st.completedCount || 0) + 1;
        st.progress = 100;
        spawnCelebration();
        const condTitle = st.factorChange === 'inc' ? f.incTitle : f.decTitle;
        const s2Word = exp.s2 === 'increase' ? '증가' : '감소';
        const s3Word = exp.s3 === 'right' ? '오른쪽' : '왼쪽';
        const s4Word = exp.s4 === 'up' ? '상승' : '하락';
        st.bannerMsg = {
          main: '🎉 탐구 완료! ‘' + condTitle + '’ → ' + f.curveLabel + ' ' + s2Word + ' → 곡선 ' + s3Word + ' 이동 → 환율 ' + s4Word,
          sub: '오른쪽 제어판에서 다른 요인을 선택하고 [시작]을 눌러 보세요!'
        };
        syncPlayBtnUI();
        renderSimStageUI();
        draw();
        ensureLoop();
      }
    } else {
      st.wrong[key] = choiceVal;
      let hintMsg = '다시 생각해 보세요! ';
      if (stepNum === 1) {
        hintMsg += '이 요인은 외화가 해외로 나가는 경우(외화의 수요)인가요, 국내로 들어오는 경우(외화의 공급)인가요?';
      } else if (stepNum === 2) {
        hintMsg += '현재 선택한 상황(‘' + (st.factorChange === 'inc' ? f.incTitle : f.decTitle) + '’)에서 ' + f.curveLabel + '가 늘어나는지 줄어드는지 생각해 보세요.';
      } else if (stepNum === 3) {
        hintMsg += f.curveLabel + '가 ' + (exp.s2 === 'increase' ? '증가' : '감소') + '할 때 그래프에서 곡선이 어느 쪽으로 이동하는지 생각해 보세요.';
      } else if (stepNum === 4) {
        hintMsg += '그래프에서 이동한 곡선과 원래 곡선이 만나는 새로운 균형점(E′)의 높이를 원래 균형 환율(E)과 비교해 보세요.';
      }
      st.feedback = {
        step: stepNum,
        tone: 'wrong',
        text: hintMsg
      };
      renderSimStageUI();
      draw();
    }
  }

  function renderControlsUI() {
    syncHintContent();
    if (!ctrlHost) return;
    frameClear(ctrlHost);
    const f = getFactor();

    const factorBtns = FACTORS.map(item => {
      const isSel = item.id === st.factorId;

        type: 'button',

        frameH('span', { 'class': 'fx-factor-ico', 'aria-hidden': 'true', text: item.icon }),
        frameH('span', { 'class': 'fx-factor-name', text: item.name })

      btn.addEventListener('click', () => {
        if (st.factorId === item.id) return;
        st.factorId = item.id;
        resetToIdle();
        renderControlsUI();
        renderSimStageUI();
        draw();
      });
      return btn;
    });

    const condBtns = [
      { id: 'inc', label: '▲ ' + f.name + ' 증가' },

        draw();

    const factorBlock = frameH('div', { 'class': 'fx-block' }, [

        frameH('h3', { 'class': 'fx-block-title', text: '환율 변동 요인 선택' }),
        frameH('span', { 'class': 'fx-badge', text: '교과서 8대 요인' })
      ]),
      frameH('div', { 'class': 'fx-factor-grid', role: 'group', 'aria-label': '환율 변동 요인' }, factorBtns),
      frameH('div', { 'class': 'fx-cond-row', role: 'group', 'aria-label': '요인 변화 조건' }, condBtns)
    ]);

    ctrlHost.appendChild(factorBlock);
  }

  function renderSimStageUI() {
    const f = getFactor();
    const exp = getExpected();
    const condTitle = st.factorChange === 'inc' ? f.incTitle : f.decTitle;

    if (trailHost) {
      frameClear(trailHost);
      if (st.step === 0) {
        trailHost.hidden = true;
      } else {
        trailHost.hidden = false;
        const trailNodes = [
          frameH('span', { 'class': 'fx-trail-label', text: '탐구 흐름' }),
          frameH('span', { 'class': 'fx-trail-chip is-factor', text: f.icon + ' ' + condTitle })
        ];
        if (st.step >= 2) {
          trailNodes.push(frameH('span', { 'class': 'fx-trail-arrow', text: '→' }));
          trailNodes.push(frameH('span', { 'class': 'fx-trail-chip is-done', text: '✓ ' + (exp.s1 === 'demand' ? '외화의 수요' : '외화의 공급') }));
        }
        if (st.step >= 3) {
          trailNodes.push(frameH('span', { 'class': 'fx-trail-arrow', text: '→' }));
          trailNodes.push(frameH('span', { 'class': 'fx-trail-chip is-done', text: '✓ ' + (exp.s1 === 'demand' ? '수요 ' : '공급 ') + (exp.s2 === 'increase' ? '증가' : '감소') }));
        }
        if (st.step >= 4) {
          trailNodes.push(frameH('span', { 'class': 'fx-trail-arrow', text: '→' }));
          trailNodes.push(frameH('span', { 'class': 'fx-trail-chip is-done', text: '✓ 곡선 ' + (exp.s3 === 'right' ? '오른쪽 이동 →' : '← 왼쪽 이동') }));
        }
        if (st.step >= 5) {
          trailNodes.push(frameH('span', { 'class': 'fx-trail-arrow', text: '→' }));
          trailNodes.push(frameH('span', {
            'class': 'fx-trail-chip ' + (exp.s4 === 'up' ? 'is-final-up' : 'is-final-down'),
            text: exp.s4 === 'up' ? '▲ 환율 상승' : '▼ 환율 하락'
          }));
        }
        trailHost.appendChild(frameH('div', { 'class': 'fx-trail-bar' }, trailNodes));
      }
    }

    if (backdropHost) {
      frameClear(backdropHost);
      const stepDefs = {
        1: {
          badge: '질문 1 / 4',
          q: '‘' + condTitle + '’은(는) 외화의 수요와 공급 중 무엇에 영향을 미치나요?',
          choices: [
            { val: 'demand', label: '외화의 수요' },
            { val: 'supply', label: '외화의 공급' }
          ]
        },
        2: {
          badge: '질문 2 / 4',
          q: '‘' + condTitle + '’ 상황은 ' + f.curveLabel + '를 어떻게 변화시키나요?',
          choices: [
            { val: 'increase', label: '증가시킨다 ▲' },
            { val: 'decrease', label: '감소시킨다 ▼' }
          ]
        },
        3: {
          badge: '질문 3 / 4',
          q: f.curveLabel + '가 ' + (exp.s2 === 'increase' ? '증가' : '감소') + '할 때, 그래프에서 ' + f.curveLabel + ' 곡선은 어느 방향으로 이동할까요?',
          choices: [
            { val: 'left', label: '← 왼쪽으로 이동' },
            { val: 'right', label: '오른쪽으로 이동 →' }
          ]
        },
        4: {
          badge: '질문 4 / 4',
          q: '곡선이 ' + (exp.s3 === 'right' ? '오른쪽' : '왼쪽') + '으로 이동했습니다! 새로운 균형점(E′)에서 환율은 어떻게 변하나요?',
          choices: [
            { val: 'up', label: '▲ 환율 상승' },
            { val: 'down', label: '▼ 환율 하락' }
          ]
        }
      };

      if (!st.modalOpen || !stepDefs[st.step]) {
        backdropHost.hidden = true;
      } else {
        backdropHost.hidden = false;
        const curDef = stepDefs[st.step];
        const key = 's' + st.step;
        const choiceBtns = curDef.choices.map(ch => {
          const isWrong = st.wrong[key] === ch.val;
          const b = frameH('button', {
            type: 'button',
            'class': 'fx-sim-btn' + (isWrong ? ' is-wrong' : '')
          }, [document.createTextNode(ch.label)]);
          b.addEventListener('click', () => handleChoice(st.step, ch.val));
          return b;
        });

        const modalKids = [
          frameH('div', { 'class': 'fx-sim-dock-main' }, [
            frameH('div', { 'class': 'fx-sim-dock-info' }, [
              frameH('div', { 'class': 'fx-sim-modal-head' }, [
                frameH('span', { 'class': 'fx-sim-stepbadge', text: curDef.badge }),
                frameH('span', { 'class': 'fx-sim-factor-tag', text: f.icon + ' ' + condTitle })
              ]),
              frameH('p', { 'class': 'fx-sim-q', text: curDef.q })
            ]),
            frameH('div', { 'class': 'fx-sim-choices', role: 'group', 'aria-label': curDef.q }, choiceBtns)
          ])
        ];

        if (st.feedback && st.feedback.step === st.step) {
          modalKids.push(
            frameH('p', {
              'class': 'fx-sim-feedback is-wrong',
              role: 'alert',
              text: st.feedback.text
            })
          );
        }

        backdropHost.appendChild(frameH('div', { 'class': 'fx-sim-modal', role: 'dialog', 'aria-label': curDef.badge }, modalKids));
      }
    }

    if (bannerHost) {
      frameClear(bannerHost);
      if (!st.bannerMsg) {
        bannerHost.hidden = true;
      } else {
        bannerHost.hidden = false;
        bannerHost.appendChild(
          frameH('p', { 'class': 'fx-sim-banner-text' }, [
            document.createTextNode(st.bannerMsg.main),
            st.bannerMsg.sub ? frameH('span', { 'class': 'fx-sim-banner-sub', text: st.bannerMsg.sub }) : null
          ])
        );
      }
    }
  }

  function fillRoundRect(g, x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + rad, y);
    g.arcTo(x + w, y, x + w, y + h, rad);
    g.arcTo(x + w, y + h, x, y + h, rad);
    g.arcTo(x, y + h, x, y, rad);
    g.arcTo(x, y, x + w, y, rad);
    g.closePath();
    g.fill();
  }

  function strokeRoundRect(g, x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + rad, y);
    g.arcTo(x + w, y, x + w, y + h, rad);
    g.arcTo(x + w, y + h, x, y + h, rad);
    g.arcTo(x, y + h, x, y, rad);
    g.arcTo(x, y, x + w, y, rad);
    g.closePath();
    g.stroke();
  }

  function drawArrow(g, x1, y1, x2, y2, headLen) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const hl = headLen || 10;
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x2, y2);
    g.stroke();
    g.beginPath();
    g.moveTo(x2, y2);
    g.lineTo(x2 - hl * Math.cos(angle - Math.PI / 6), y2 - hl * Math.sin(angle - Math.PI / 6));
    g.lineTo(x2 - hl * Math.cos(angle + Math.PI / 6), y2 - hl * Math.sin(angle + Math.PI / 6));
    g.closePath();
    g.fill();
  }

  function draw() {
    if (!slot) return;
    const canvas = slot.querySelector('.dc-content .scene-canvas');
    const box = slot.getBoundingClientRect();
    if (!box.width || !box.height) return;

    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cw = Math.round(box.width * dpr);
    const ch = Math.round(box.height * dpr);
    if (canvas.width !== cw || canvas.height !== ch) {
      canvas.width = cw;
      canvas.height = ch;
    }

    const g = canvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = box.width;
    const H = box.height;
    g.clearRect(0, 0, W, H);

    const f = getFactor();
    const exp = getExpected();
    const fontBase = '"Noto Sans KR",system-ui,"Malgun Gothic",sans-serif';

    const padX = Math.max(18, Math.round(W * 0.03));
    const cardX = padX;
    const cardY = 74;
    const cardW = W - padX * 2;
    const cardH = Math.max(240, H - cardY - 40);

    g.fillStyle = colors.surface;
    fillRoundRect(g, cardX, cardY, cardW, cardH, 16);
    g.strokeStyle = colors.line;
    g.lineWidth = 1.5;
    strokeRoundRect(g, cardX, cardY, cardW, cardH, 16);

    // 카드 상단 현재 선택 요인 및 시작 전 안내 표시 (그래프 위치가 흔들리지 않도록 상단 헤더 고정)
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.fillStyle = colors.ink;
    g.font = '800 22px ' + fontBase;
    const condTitle = st.factorChange === 'inc' ? f.incTitle : f.decTitle;
    const titleStr = f.icon + ' ' + condTitle + '에 따른 외화 시장 그래프';
    g.fillText(titleStr, cardX + 26, cardY + 32);

    if (st.step === 0) {
      g.fillStyle = colors.accent;
      g.font = '700 16.5px ' + fontBase;
      g.textAlign = 'right';
      g.fillText('오른쪽 제어판에서 요인을 고른 뒤 [▶ 시작]을 눌러 보세요', cardX + cardW - 26, cardY + 32);
      g.textAlign = 'left';
    } else if (anim.shiftProgress > 0.25) {
      // 곡선 이동 배지는 그래프 위 곡선 라벨(수요′/공급′)과 절대 겹치지 않도록 카드 헤더 우측에 깔끔하게 배치
      const isDemandTargetHeader = exp.s1 === 'demand';
      const targetColorHeader = isDemandTargetHeader ? colors.accent : colors.warning;
      const moveText = exp.s3 === 'right' ? (f.curveLabel + ' 증가 (곡선 오른쪽 이동 →)') : ('(← 곡선 왼쪽 이동) ' + f.curveLabel + ' 감소');
      g.font = '800 15.5px ' + fontBase;
      const tw = g.measureText(moveText).width + 26;
      const bx = cardX + cardW - 26 - tw;
      const by = cardY + 16;
      g.fillStyle = isDemandTargetHeader ? colors.accentWash : colors.warningWash;
      fillRoundRect(g, bx, by, tw, 32, 16);
      g.strokeStyle = targetColorHeader;
      g.lineWidth = 1.8;
      strokeRoundRect(g, bx, by, tw, 32, 16);
      g.fillStyle = targetColorHeader;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(moveText, bx + tw / 2, by + 16);
      g.textAlign = 'left';
    }

    // 그래프 축 내부 좌표 (시작 전/후 언제나 동일한 고정 위치! x축과 수요·공급곡선을 위쪽에 배치해 하단 질문 카드 자리 상시 확보)
    const topStart = 66;
    const bottomReserve = 148;
    const availH = Math.max(180, cardH - topStart - bottomReserve);
    const maxGraphW = Math.min(cardW - 220, 620);
    const maxGraphH = Math.max(175, Math.min(availH, 340));
    const gx0 = Math.round(cardX + (cardW - maxGraphW) / 2 + 44);
    const gx1 = gx0 + maxGraphW;
    const gy0 = Math.round(cardY + topStart);
    const gy1 = gy0 + maxGraphH;
    const gw = gx1 - gx0;
    const gh = gy1 - gy0;

    const toX = u => gx0 + u * gw;
    const toY = v => gy1 - v * gh;

    function curveV(type, u, shiftU) {
      const u0 = u - (shiftU || 0);
      const bend = 0.22 * u0 * (1 - u0);
      if (type === 'demand') {
        return 0.86 - 0.72 * u0 - bend;
      } else {
        return 0.14 + 0.72 * u0 - bend;
      }
    }

    function drawCurvePath(type, shiftU, uMin, uMax) {
      g.beginPath();
      const steps = 48;
      let started = false;
      for (let i = 0; i <= steps; i++) {
        const u = uMin + ((uMax - uMin) * i) / steps;
        const v = curveV(type, u, shiftU);
        if (v < 0.04 || v > 0.94) continue;
        const px = toX(u);
        const py = toY(v);
        if (!started) {
          g.moveTo(px, py);
          started = true;
        } else {
          g.lineTo(px, py);
        }
      }
      g.stroke();
    }

    const shiftDir = exp.s3 === 'right' ? 1 : -1;
    const maxShiftU = 0.21 * shiftDir;
    const curShiftU = maxShiftU * anim.shiftProgress;

    const eq0 = { u: 0.5, v: curveV('demand', 0.5, 0) };
    const eq1 = {
      u: 0.5 + curShiftU * 0.5,
      v: exp.s1 === 'demand'
        ? curveV('supply', 0.5 + curShiftU * 0.5, 0)
        : curveV('demand', 0.5 + curShiftU * 0.5, 0)
    };

    // 1. 기본 균형점(E) 점선 보조선
    if (st.labels) {
      g.save();
      g.setLineDash([6, 5]);
      g.strokeStyle = colors.muted;
      g.lineWidth = 1.8;
      g.beginPath();
      g.moveTo(gx0, toY(eq0.v));
      g.lineTo(toX(eq0.u), toY(eq0.v));
      g.lineTo(toX(eq0.u), gy1);
      g.stroke();
      g.restore();
    }

    // 2. 새로운 균형점(E') 점선 보조선 및 환율 변동 화살표
    if (anim.shiftProgress > 0.05) {
      const showNewGuides = st.step >= 4 || anim.shiftProgress > 0.4;
      if (showNewGuides) {
        const rateColor = exp.s4 === 'up' ? colors.warning : colors.accent;
        g.save();
        g.setLineDash([6, 4]);
        g.strokeStyle = rateColor;
        g.lineWidth = 2.2;
        g.beginPath();
        g.moveTo(gx0, toY(eq1.v));
        g.lineTo(toX(eq1.u), toY(eq1.v));
        g.lineTo(toX(eq1.u), gy1);
        g.stroke();
        g.restore();

        if (anim.rateProgress > 0.02) {
          const yStart = toY(eq0.v);
          const yEnd = toY(eq0.v + (eq1.v - eq0.v) * anim.rateProgress);
          g.fillStyle = frameHexRgba(rateColor, 0.12);
          g.fillRect(gx0 + 1, Math.min(yStart, yEnd), toX(Math.max(eq0.u, eq1.u)) - gx0, Math.abs(yEnd - yStart));

          g.strokeStyle = rateColor;
          g.fillStyle = rateColor;
          g.lineWidth = 3.5;
          drawArrow(g, gx0 - 16, yStart, gx0 - 16, yEnd, 9);

          g.font = '800 16px ' + fontBase;
          g.textAlign = 'right';
          g.textBaseline = 'middle';
          const rateLabel = exp.s4 === 'up' ? '환율 상승 ▲' : '환율 하락 ▼';
          const labelY = exp.s4 === 'up' ? Math.min(yEnd, yStart - 26) : Math.max(yEnd, yStart + 26);
          g.fillText(rateLabel, gx0 - 26, labelY);
        }
      }
    }

    // 3. 수요 곡선(파란색) & 공급 곡선(분홍색)
    const isDemandTarget = exp.s1 === 'demand';
    const isSupplyTarget = exp.s1 === 'supply';
    const pulseScale = 0.5 + 0.5 * Math.sin(anim.highlightPulse);

    if (st.step >= 2 && isDemandTarget) {
      g.save();
      g.strokeStyle = frameHexRgba(colors.accent, 0.22 + 0.18 * pulseScale);
      g.lineWidth = 15 + 5 * pulseScale;
      g.lineCap = 'round';
      drawCurvePath('demand', 0, 0.12, 0.88);
      g.restore();
    }
    g.save();
    g.strokeStyle = colors.accent;
    g.lineWidth = (st.step >= 2 && isDemandTarget) ? 4.5 : 3.5;
    if (anim.shiftProgress > 0.05 && isDemandTarget) {
      g.strokeStyle = frameHexRgba(colors.accent, 0.45);
      g.setLineDash([6, 5]);
    }
    g.lineCap = 'round';
    drawCurvePath('demand', 0, 0.12, 0.88);
    g.restore();

    if (st.step >= 2 && isSupplyTarget) {
      g.save();
      g.strokeStyle = frameHexRgba(colors.warning, 0.22 + 0.18 * pulseScale);
      g.lineWidth = 15 + 5 * pulseScale;
      g.lineCap = 'round';
      drawCurvePath('supply', 0, 0.12, 0.88);
      g.restore();
    }
    g.save();
    g.strokeStyle = colors.warning;
    g.lineWidth = (st.step >= 2 && isSupplyTarget) ? 4.5 : 3.5;
    if (anim.shiftProgress > 0.05 && isSupplyTarget) {
      g.strokeStyle = frameHexRgba(colors.warning, 0.45);
      g.setLineDash([6, 5]);
    }
    g.lineCap = 'round';
    drawCurvePath('supply', 0, 0.12, 0.88);
    g.restore();

    // 4. 이동한 곡선 (D' 또는 S') 및 이동 화살표
    if (anim.shiftProgress > 0.01) {
      const targetColor = isDemandTarget ? colors.accent : colors.warning;
      const uMinShift = Math.max(0.08, 0.12 + curShiftU);
      const uMaxShift = Math.min(0.92, 0.88 + curShiftU);

      g.save();
      g.strokeStyle = frameHexRgba(targetColor, 0.22);
      g.lineWidth = 12;
      g.lineCap = 'round';
      drawCurvePath(exp.s1, curShiftU, uMinShift, uMaxShift);
      g.restore();

      g.save();
      g.strokeStyle = targetColor;
      g.lineWidth = 4.5;
      g.lineCap = 'round';
      drawCurvePath(exp.s1, curShiftU, uMinShift, uMaxShift);
      g.restore();

      if (anim.shiftProgress > 0.25) {
        [0.32, 0.68].forEach(uBase => {
          const vLevel = curveV(exp.s1, uBase, 0);
          const xFrom = toX(uBase) + (shiftDir * 8);
          const xTo = toX(uBase + curShiftU) - (shiftDir * 8);
          if (Math.abs(xTo - xFrom) > 14) {
            g.save();
            g.strokeStyle = targetColor;
            g.fillStyle = targetColor;
            g.lineWidth = 3;
            drawArrow(g, xFrom, toY(vLevel), xTo, toY(vLevel), 9);
            g.restore();
          }
        });
      }
    }

    // 5. 곡선 이름 라벨 (가이드 기준: 18px, 곡선 끝점 위 여백에 겹침 없이 표시)
    const dTopU = 0.12;
    const dTopV = curveV('demand', dTopU, 0);
    g.font = '800 18px ' + fontBase;
    g.textAlign = 'center';
    g.textBaseline = 'bottom';
    g.fillStyle = colors.accent;
    g.fillText('수요(D)', toX(dTopU), toY(dTopV) - 10);

    const sTopU = 0.88;
    const sTopV = curveV('supply', sTopU, 0);
    g.fillStyle = colors.warning;
    g.fillText('공급(S)', toX(sTopU), toY(sTopV) - 10);

    if (anim.shiftProgress > 0.4) {
      if (isDemandTarget) {
        const dNewU = Math.max(0.08, Math.min(0.88, 0.12 + curShiftU));
        const dNewV = curveV('demand', dNewU, curShiftU);
        g.fillStyle = colors.accent;
        g.fillText('수요′(D′)', toX(dNewU), toY(dNewV) - 10);
      } else {
        const sNewU = Math.max(0.12, Math.min(0.92, 0.88 + curShiftU));
        const sNewV = curveV('supply', sNewU, curShiftU);
        g.fillStyle = colors.warning;
        g.fillText('공급′(S′)', toX(sNewU), toY(sNewV) - 10);
      }
    }

    // 6. 좌표축 및 축 이름 (교실 뒤에서도 잘 읽히도록 16~18px 적용)
    g.strokeStyle = colors.ink;
    g.fillStyle = colors.ink;
    g.lineWidth = 2.5;
    drawArrow(g, gx0, gy1, gx0, gy0, 10);
    drawArrow(g, gx0, gy1, gx1, gy1, 10);

    g.fillStyle = colors.ink;
    g.font = '800 18px ' + fontBase;
    g.textAlign = 'right';
    g.textBaseline = 'top';
    g.fillText('환율', gx0 - 12, gy0 - 6);
    g.font = '700 14.5px ' + fontBase;
    g.fillStyle = colors.muted;
    g.fillText('(원/달러)', gx0 - 12, gy0 + 18);

    g.font = '800 16px ' + fontBase;
    g.fillStyle = colors.ink;
    g.textAlign = 'right';
    g.textBaseline = 'top';
    g.fillText('0', gx0 - 10, gy1 + 6);

    g.font = '800 17px ' + fontBase;
    g.textAlign = 'right';
    g.fillText('외화 거래량', gx1, gy1 + 10);

    if (st.labels) {
      g.fillStyle = colors.ink;
      g.font = '800 16.5px ' + fontBase;
      g.textAlign = 'right';
      g.textBaseline = 'middle';
      g.fillText('균형 환율', gx0 - 12, toY(eq0.v));

      g.textAlign = 'center';
      g.textBaseline = 'top';
      g.fillText('균형 거래량', toX(eq0.u), gy1 + 10);
    }

    window.addEventListener('resize',()=>{if(width!==null&&handles[0])apply(handles[0],width);});
  })();
  const mobileQuery=window.matchMedia('(min-width:'+cfg.mobileMinWidth+'px)');
  function devicePolicy(){const blocked=!cfg.mobileSupported&&!mobileQuery.matches;frame.hidden=blocked;block.hidden=!blocked;if(blocked){entries[current].engine.deactivate();updatePlay(current);if(dialog.open)dialog.close();}else if(!document.hidden){entries[current].engine.activate();}entries[current].engine.resize();}
  if(mobileQuery.addEventListener)mobileQuery.addEventListener('change',devicePolicy);else mobileQuery.addListener(devicePolicy);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){entries[current].engine.deactivate();updatePlay(current);if(audio?.state==='running')audio.suspend();}else devicePolicy();});
  window.addEventListener('pagehide',()=>entries.forEach(en=>{en.engine.destroy();if(en.objects.time)en.objects.time.destroy();}));
  window.addEventListener('pageshow',devicePolicy);
  // 내용 엔진이 emit을 통해 출력값을 전달하며, 각 페이지 상태는 이 세션에서 독립적으로 유지됩니다.
  window.CONTENT_FRAME={config:cfg,states,entries,switchPage,setStep:setKidStep};
  switchPage(Math.max(0,Math.min(entries.length-1,Number(cfg.startPage)||0)));
  devicePolicy();
})();
// COMMON RUNTIME END
</script></div></body></html>
